<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>2447 Training Programme Oct–Dec 2026</title><link rel="stylesheet" href="style.css"></head><body>
<header><h1>2447 Training Programme</h1><p>October – December 2026</p></header>
<main>
<section id="next" class="card next"></section>
<section class="controls">
<input id="q" type="search" placeholder="Search sessions… (e.g. drill, sim)" aria-label="Search">
<div id="dress" class="chips"></div>
<div class="chips"><button class="chip" id="hidePast" aria-pressed="false">Hide past</button>
<select id="month" aria-label="Month"><option value="">All months</option><option value="10">October</option><option value="11">November</option><option value="12">December</option></select></div>
</section>
<section id="list"></section>
<p class="note">Tap a session for details. Sessions run 7:00–9:00 pm. Download as image saves a short notification card. Dress colours follow the unit's key.</p>
</main>
